[project]
name = "itsm-agentic-platform"
version = "0.1.0"
description = "Production-grade Generative AI + Agentic platform for IT Service Management"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.3",
    "httpx>=0.27.2",
    # agent core
    "langgraph>=0.2.45",
    "langgraph-checkpoint-postgres>=2.0.2",
    "langchain-core>=0.3.15",
    # model access
    "litellm>=1.52.0",
    "tiktoken>=0.8.0",
    # durable data
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg[binary,pool]>=3.2.3",
    "pgvector>=0.3.6",
    "alembic>=1.14.0",
    # vector / search
    "opensearch-py>=2.8.0",
    # fast state
    "redis>=5.2.0",
    # storage + workers
    "boto3>=1.35.0",
    "aioboto3>=13.2.0",
    "celery[redis]>=5.4.0",
    # parsing
    "docling>=2.5.0",
    "pypdf>=5.1.0",
    "markdownify>=0.13.1",
    # observability
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-exporter-otlp>=1.28.0",
    "langfuse>=2.53.0",
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",
    # security
    "pyjwt[crypto]>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.3",
    "mypy>=1.13.0",
    "respx>=0.21.1",
    "freezegun>=1.5.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C4", "RET", "SIM"]
ignore = ["S101", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
